services:
  transducer-audit:
    build: .
    image: transducer-audit:latest
    container_name: transducer-audit
    # 宿主机端口可配置：HOST_PORT / HOST_BIND（默认 127.0.0.1:8080）
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    environment:
      # 容器内监听地址/端口（一般无需修改）
      HOST: "0.0.0.0"
      PORT: "8080"
      TRANSDUCER_DB: "/srv/data/audits.db"
    volumes:
      - audit-data:/srv/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3); assert json.load(r)['status']=='ok'"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 5s

volumes:
  audit-data:
